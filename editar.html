<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Imagenes/favicon.avif" type="image/x-icon" />
    <link rel="shortcut icon" href="Imagenes/favicon.avif" />

    <title>Editar productos - Rápido y Sabroso</title>

    <link rel="stylesheet" href="css/editor.css" />
  </head>

  <body>
    <header id="jaja">
      <div class="logo">
        <img src="Imagenes/favicon.avif" alt="" id="Logo" />
      </div>
      <p>¡Street Food al estilo Nuestro!</p>
      <div class="menu-container">
        <button class="menu-toggle" aria-label="Abrir menú">&#9776;</button>
        <nav class="menu">
          <ul>
            <li><a href="index.html">Comidas</a></li>
            <li><a href="bebidas.html">Bebidas</a></li>
            <li><a href="about.html">Nosotros</a></li>
            <li><a href="agregar.html">Agregar</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <!-- LOGIN -->
    <section id="loginSection" class="login-container">
      <div class="login-box">
        <!-- <img
          src="Imagenes/logo-transparente.avif"
          alt="Rápido y Sabroso"
          class="logo-login"
        /> -->

        <h1>Panel de edición</h1>

        <p>Ingresá tus credenciales para continuar.</p>

        <form id="loginForm">
          <div class="campo">
            <label for="usuario">Usuario</label>

            <input type="text" id="usuario" autocomplete="username" required />
          </div>

          <div class="campo">
            <label for="password">Contraseña</label>

            <input
              type="password"
              id="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit">Ingresar</button>

          <p id="loginError" class="error"></p>
        </form>
      </div>
    </section>

    <!-- PANEL DE EDICIÓN -->
    <section id="editorSection" class="editor-container oculto">
      <header class="editor-header">
        <div class="logo">
          <img src="Imagenes/favicon.avif" alt="" id="Logo" />
        </div>
        <div>
          <h1>Editar productos</h1>
          <p>Rápido y Sabroso</p>
        </div>

        <button id="btnCerrarSesion">Cerrar sesión</button>
      </header>

      <div class="editor-content">
        <div class="editor-toolbar">
          <input
            type="search"
            id="buscarProducto"
            placeholder="Buscar producto..."
          />

          <select id="filtroTipo">
            <option value="todos">Todos</option>

            <option value="comida">Comidas</option>

            <option value="bebida">Bebidas</option>
          </select>
        </div>

        <div id="listaProductos"></div>
      </div>
    </section>

    <script src="js/editor.js"></script>
  </body>
</html>
